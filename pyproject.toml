[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icarus-ruleset-builder"
version = "0.1.0"
description = "Validate and compile configurable ICARUS dedicated-server rulesets"
requires-python = ">=3.11"

[project.scripts]
icarus-ruleset = "icarus_ruleset.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

